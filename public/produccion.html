<script>
let talleres = [];
let produccionPorTaller = {};
let tallerActual = 'TODOS';
let articulosCacheProduccion = [];
window.articulosCacheProduccion = articulosCacheProduccion;

const $ = id => document.getElementById(id);

function texto(v){
    return v === null || v === undefined ? '' : String(v).trim();
}

function escapar(v){
    return texto(v)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
}

function numero(v){
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
}

function fechaMostrar(v){
    if(!v) return '';
    const s = texto(v);
    if(/^\d{4}-\d{2}-\d{2}/.test(s)){
        const [y,m,d] = s.substring(0,10).split('-');
        return `${d}/${m}/${y}`;
    }
    return s;
}

const CACHE_PRODUCCION_KEY = 'gc_produccion_cache_v1';
const CACHE_PRODUCCION_TTL = 1000 * 60 * 60 * 12; // 12 horas

function leerCacheProduccion(){

    try{

        const raw =
            localStorage.getItem(
                CACHE_PRODUCCION_KEY
            );

        if(!raw){
            return null;
        }

        const cache =
            JSON.parse(raw);

        if(
            !cache ||
            !cache.timestamp ||
            !cache.talleres ||
            !cache.produccionPorTaller
        ){
            return null;
        }

        return cache;

    }catch(error){

        console.warn(
            '⚠️ No se pudo leer la memoria local de producción:',
            error
        );

        return null;
    }
}

function guardarCacheProduccion(){

    try{

        localStorage.setItem(
            CACHE_PRODUCCION_KEY,
            JSON.stringify({
                timestamp: Date.now(),
                talleres,
                produccionPorTaller,
                articulosCacheProduccion
            })
        );

    }catch(error){

        console.warn(
            '⚠️ No se pudo guardar la memoria local de producción:',
            error
        );
    }
}

function mostrarEstadoCache(textoEstado){

    const estado =
        $('estado-cache-produccion');

    if(estado){
        estado.textContent =
            textoEstado;
    }
}

function cargarDesdeMemoria(){

    const cache =
        leerCacheProduccion();

    if(!cache){
        return false;
    }

    talleres =
        Array.isArray(cache.talleres)
            ? cache.talleres
            : [];

    produccionPorTaller =
        cache.produccionPorTaller || {};

    articulosCacheProduccion =
        Array.isArray(cache.articulosCacheProduccion)
            ? cache.articulosCacheProduccion
            : [];

    window.articulosCacheProduccion =
        articulosCacheProduccion;

    renderTalleres();

    seleccionarTaller('TODOS');

    const fecha =
        new Date(cache.timestamp);

    mostrarEstadoCache(
        `MEMORIA: ${fecha.toLocaleString('es-AR')}`
    );

    return true;
}

async function cargarTalleresDesdeSheet(){

    const respuesta =
        await fetch(
            '/api/talleres',
            {
                cache:'no-store'
            }
        );

    const data =
        await respuesta.json();

    if(
        !respuesta.ok ||
        data.success === false
    ){
        throw new Error(
            data.error ||
            'No se pudieron cargar los talleres.'
        );
    }

    talleres =
        Array.isArray(data)
            ? data
            : (
                Array.isArray(data.talleres)
                    ? data.talleres
                    : []
            );

    talleres =
        talleres
            .map(t => {

                if(typeof t === 'string'){
                    return t;
                }

                return texto(
                    t.nombre ||
                    t.TALLER ||
                    t.taller ||
                    t.NOMBRE
                );

            })
            .filter(Boolean);

    talleres =
        [...new Set(talleres)]
            .sort(
                (a,b) =>
                    a.localeCompare(
                        b,
                        'es',
                        {
                            sensitivity:'base'
                        }
                    )
            );

    try{

        const r =
            await fetch(
                '/api/articulos',
                {
                    cache:'no-store'
                }
            );

        if(r.ok){

            const d =
                await r.json();

            articulosCacheProduccion =
                Array.isArray(d)
                    ? d
                    : (
                        Array.isArray(d.articulos)
                            ? d.articulos
                            : []
                    );

            window.articulosCacheProduccion =
                articulosCacheProduccion;
        }

    }catch(_){

        // Artículos es opcional.

    }

    await cargarProduccionTodosDesdeSheet();

    guardarCacheProduccion();

    const fecha =
        new Date();

    mostrarEstadoCache(
        `MEMORIA: ${fecha.toLocaleString('es-AR')}`
    );
}

async function cargarTalleres(){

    /*
     * PRIMERA APERTURA:
     * 1. Si existe memoria local, se muestra inmediatamente.
     * 2. No se consulta Google Sheets.
     *
     * Si todavía no existe memoria, se hace la carga inicial.
     */
    const usoMemoria =
        cargarDesdeMemoria();

    if(usoMemoria){

        $('resumen-produccion').textContent =
            'Producción cargada desde memoria. Usá 🔄 ACTUALIZAR para leer Google Sheets.';

        return;
    }

    $('resumen-produccion').textContent =
        'Primera carga: leyendo Google Sheets...';

    await cargarTalleresDesdeSheet();
}

async function cargarProduccionTodosDesdeSheet(){

    $('resumen-produccion').textContent =
        'Actualizando producción desde Google Sheets...';

    const nuevoProduccionPorTaller = {};

    const resultados =
        await Promise.all(
            talleres.map(
                async taller => {

                    try{

                        return {
                            taller,
                            datos:
                                await cargarProduccionTaller(
                                    taller
                                )
                        };

                    }catch(error){

                        console.error(
                            `❌ PRODUCCIÓN ${taller}:`,
                            error
                        );

                        return {
                            taller,
                            datos:{
                                pendientes:[],
                                reparaciones:[],
                                muestras:[]
                            }
                        };
                    }
                }
            )
        );

    resultados.forEach(
        ({taller,datos}) => {

            nuevoProduccionPorTaller[taller] =
                datos;

        }
    );

    produccionPorTaller =
        nuevoProduccionPorTaller;

    seleccionarTaller('TODOS');
}

async function actualizarProduccionDesdeSheet(){

    const boton =
        $('btn-actualizar-produccion');

    if(boton){

        boton.disabled = true;

        boton.textContent =
            '⏳ ACTUALIZANDO...';
    }

    mostrarEstadoCache(
        'MEMORIA: actualizando...'
    );

    try{

        /*
         * IMPORTANTE:
         * Solamente este botón vuelve a consultar
         * talleres, artículos y producción del servidor.
         */
        await cargarTalleresDesdeSheet();

        mostrarEstadoCache(
            `MEMORIA: ${new Date().toLocaleString('es-AR')}`
        );

    }catch(error){

        console.error(
            '❌ ERROR ACTUALIZANDO PRODUCCIÓN:',
            error
        );

        alert(
            '❌ No se pudo actualizar desde Google Sheets.\n\n' +
            error.message
        );

        /*
         * Si ya había memoria válida, conservamos
         * lo que estaba mostrado.
         */
        if(
            Object.keys(produccionPorTaller).length
        ){

            renderProduccion();

        }

    }finally{

        if(boton){

            boton.disabled = false;

            boton.textContent =
                '🔄 ACTUALIZAR';
        }
    }
}


function renderTalleres(){

    const contenedor = $('lista-talleres');

    contenedor.innerHTML = '';

    const todos = document.createElement('button');
    todos.type = 'button';
    todos.className = 'taller-btn activo';
    todos.dataset.taller = 'TODOS';
    todos.textContent = 'TODOS';
    todos.onclick = () => seleccionarTaller('TODOS');
    contenedor.appendChild(todos);

    talleres.forEach(nombre => {

        const boton = document.createElement('button');

        boton.type = 'button';
        boton.className = 'taller-btn';
        boton.dataset.taller = nombre;
        boton.textContent = nombre;

        boton.onclick = () =>
            seleccionarTaller(nombre);

        contenedor.appendChild(boton);
    });
}

function normalizarRespuestaProduccion(data){

    return {
        pendientes:
            Array.isArray(data?.pendientes)
                ? data.pendientes
                : [],

        reparaciones:
            Array.isArray(data?.reparaciones)
                ? data.reparaciones
                : [],

        muestras:
            Array.isArray(data?.muestras)
                ? data.muestras
                : []
    };
}

async function cargarProduccionTaller(taller){

    /*
     * MISMA API QUE USA INDEX:
     * /api/talleres/:tallerId/pendientes
     *
     * El backend existente es quien decide qué está
     * realmente en producción.
     */
    const url =
        `/api/talleres/${encodeURIComponent(taller)}/pendientes`;

    const respuesta =
        await fetch(url,{cache:'no-store'});

    const data =
        await respuesta.json();

    if(!respuesta.ok){
        throw new Error(
            data.error ||
            `No se pudo cargar la producción de ${taller}.`
        );
    }

    return normalizarRespuestaProduccion(data);
}

async function cargarProduccionTodos(){

    /*
     * Compatibilidad: no fuerza una lectura de Sheets.
     * La actualización real pasa por el botón.
     */
    return cargarDesdeMemoria();

}

function combinarTodos(){

    const salida = {
        pendientes:[],
        reparaciones:[],
        muestras:[]
    };

    Object.entries(produccionPorTaller)
        .forEach(([taller,datos]) => {

            ['pendientes','reparaciones','muestras']
                .forEach(categoria => {

                    datos[categoria].forEach(item => {

                        salida[categoria].push({
                            ...item,
                            taller:
                                texto(
                                    item.taller ||
                                    item.TALLER ||
                                    taller
                                ) || taller
                        });

                    });
                });
        });

    return salida;
}

function datosActuales(){

    if(tallerActual === 'TODOS'){
        return combinarTodos();
    }

    return produccionPorTaller[tallerActual] || {
        pendientes:[],
        reparaciones:[],
        muestras:[]
    };
}

function obtenerArticulo(item){
    /*
     * INDEX usa codigo / articulo_codigo y, cuando no vienen,
     * resuelve el codigo mediante articulo_id. PRODUCCION debe
     * mostrar exactamente el mismo dato.
     */
    const directo =
        item?.codigo ??
        item?.articulo_codigo ??
        item?.articulo ??
        item?.ARTICULO ??
        item?.art ??
        item?.ART;

    if(directo !== undefined && directo !== null && texto(directo) !== ''){
        return texto(directo);
    }

    if(item?.articulo_id !== undefined && item?.articulo_id !== null){
        const encontrado =
            window.articulosCacheProduccion?.find(
                a => String(a.id) === String(item.articulo_id)
            );

        if(encontrado){
            return texto(encontrado.codigo ?? encontrado.id);
        }
    }

    return '';
}

function obtenerCantidad(item){
    return numero(
        item.cantidad_pendiente ??
        item.CANTIDAD_PENDIENTE ??
        item.cantidad ??
        item.CANTIDAD ??
        item.cant ??
        item.CANT
    );
}

function obtenerColor(item){
    return texto(
        item.color ??
        item.COLOR
    );
}

function obtenerSalida(item){
    return texto(
        item.fecha_salida ??
        item.FECHA_SALIDA ??
        item.fecha ??
        item.FECHA ??
        item.salida ??
        item.SALIDA
    );
}

function renderTabla(id, items){

    const tbody = $(id);

    tbody.innerHTML = '';

    if(!items.length){

        tbody.innerHTML = `
            <tr>
                <td colspan="5"
                    class="text-center text-slate-500 py-6">
                    Sin producción
                </td>
            </tr>
        `;

        return;
    }

    items.forEach(item => {

        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>${escapar(
                item.taller ||
                item.TALLER ||
                ''
            )}</td>

            <td class="font-black text-white">
                ${escapar(obtenerArticulo(item))}
            </td>

            <td class="text-center font-black text-white">
                ${obtenerCantidad(item)}
            </td>

            <td>${escapar(obtenerColor(item))}</td>

            <td class="text-center">
                ${escapar(fechaMostrar(obtenerSalida(item)))}
            </td>
        `;

        tbody.appendChild(tr);
    });
}


// ============================================================
// ORDENAMIENTO DE PRODUCCIÓN
// ============================================================

let ordenProduccionActual = 'articulo';

function valorArticuloProduccion(item){
    return String(
        obtenerArticulo(item) ??
        item?.codigo ??
        item?.articulo_codigo ??
        item?.articulo ??
        ''
    ).trim();
}

function valorTallerProduccion(item){
    return String(
        item?.taller ??
        item?.TALLER ??
        ''
    ).trim();
}

function compararProduccion(a, b, campo){
    const va =
        campo === 'articulo'
            ? valorArticuloProduccion(a)
            : valorTallerProduccion(a);

    const vb =
        campo === 'articulo'
            ? valorArticuloProduccion(b)
            : valorTallerProduccion(b);

    /*
     * Artículos numéricos: 1810, 1855, 1912, 2010...
     * Talleres: orden alfabético.
     */
    if(campo === 'articulo'){
        const na = Number(va);
        const nb = Number(vb);

        if(
            Number.isFinite(na) &&
            Number.isFinite(nb)
        ){
            return na - nb;
        }
    }

    return va.localeCompare(
        vb,
        'es',
        {
            numeric: true,
            sensitivity: 'base'
        }
    );
}

function ordenarProduccion(lista, campo){
    return [...(lista || [])].sort(
        (a,b) =>
            compararProduccion(
                a,
                b,
                campo
            )
    );
}

function aplicarOrdenProduccion(campo){

    ordenProduccionActual =
        campo === 'taller'
            ? 'taller'
            : 'articulo';

    /*
     * IMPORTANTE:
     * No hacemos otra consulta al servidor.
     * Ordenamos inmediatamente lo que ya está cargado
     * y volvemos a pintar las tres tablas.
     */
    renderProduccion();

    const botonArticulo =

// ============================================================
// INFORME PARA IMPRIMIR — MERCADERÍA EN PRODUCCIÓN
//
// HOJA 1:
//   DISPONIBLES EN TALLERES
//   - PENDIENTES actualmente en talleres.
//   - Cantidad >= 10.
//
// HOJA 2:
//   DISPONIBLES EN PRODUCCIÓN
//   - TODO artículo de TAREAS_ARTICULOS que todavía esté
//     físicamente en fábrica.
//   - Incluye tareas PENDIENTES y COMPLETAS.
//   - Incluye artículos RESERVADOS y SIN RESERVA.
//   - Queda afuera solamente lo que tenga FECHA DE SALIDA
//     o MOVIMIENTO_ID.
//   - Cantidad >= 10.
//
// IMPORTANTE:
//   Esto es únicamente para el INFORME de PRODUCCIÓN.
//   NO cambia la lógica de INDEX ni de TAREAS.
// ============================================================

function fechaOrdenInforme(valor){
    const s = texto(valor);

    if(/^\d{4}-\d{2}-\d{2}/.test(s)){
        const [y,m,d] = s.substring(0,10).split('-').map(Number);
        return new Date(y,m-1,d).getTime();
    }

    if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){
        const [d,m,y] = s.split('/').map(Number);
        return new Date(y,m-1,d).getTime();
    }

    return Number.MAX_SAFE_INTEGER;
}

function fechaInformeDDMMAAAA(valor){
    const s = texto(valor);

    if(/^\d{4}-\d{2}-\d{2}/.test(s)){
        const [y,m,d] = s.substring(0,10).split('-');
        return `${d}/${m}/${y}`;
    }

    if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){
        return s;
    }

    return s;
}

function numeroArticuloInforme(valor){
    const n = Number(texto(valor));
    return Number.isFinite(n) ? n : null;
}

function compararArticuloInforme(a,b){
    const na = numeroArticuloInforme(a.articulo);
    const nb = numeroArticuloInforme(b.articulo);

    if(na !== null && nb !== null && na !== nb){
        return na - nb;
    }

    const cmp = String(a.articulo).localeCompare(
        String(b.articulo),
        'es',
        {numeric:true,sensitivity:'base'}
    );

    if(cmp !== 0) return cmp;

    const fc = fechaOrdenInforme(a.fechaTarea) -
               fechaOrdenInforme(b.fechaTarea);

    if(fc !== 0) return fc;

    return String(a.color||'').localeCompare(
        String(b.color||''),
        'es',
        {sensitivity:'base'}
    );
}

function escaparInforme(valor){
    return String(valor ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

// El endpoint de INFORME se mantiene exclusivo de PRODUCCIÓN.
// La lógica del servidor debe devolver PENDIENTES + COMPLETAS.
// Esta función simplemente consume todo lo que entregue.
async function obtenerDatosTareasInforme(){

    const respuesta = await fetch(
        '/api/produccion/informe',
        {cache:'no-store'}
    );

    const data = await respuesta.json();

    if(!respuesta.ok || data.success === false){
        throw new Error(
            data.error ||
            'No se pudieron cargar las tareas para el informe.'
        );
    }

    return Array.isArray(data.tareas)
        ? data.tareas
        : [];
}

function construirInformeProduccion(pendientes, tareas){

    const hoy = new Date();
    const fechaHoy = hoy.toLocaleDateString('es-AR');
    const registros = [];

    // TALLERES: se mantienen las mismas condiciones actuales.
    (pendientes || [])
        .map(item => ({
            articulo: obtenerArticulo(item),
            cantidad: obtenerCantidad(item),
            color: obtenerColor(item),
            ubicacion: texto(item.taller || item.TALLER),
            fecha: obtenerSalida(item),
            estado: 'EN TALLER',
            fechaOrden: obtenerSalida(item)
        }))
        .filter(item =>
            item.cantidad >= 10 &&
            item.ubicacion
        )
        .forEach(item => registros.push(item));

    // FÁBRICA / PRODUCCIÓN: se mantienen las mismas condiciones actuales.
    // Si tiene taller, se muestra ese taller; si no, se muestra FÁBRICA.
    (tareas || [])
        .map(item => ({
            articulo: texto(item.articulo),
            cantidad: numero(item.cantidad),
            color: texto(item.color).toUpperCase(),
            ubicacion: texto(item.taller).toUpperCase() || 'FÁBRICA',
            fecha: texto(item.fechaTarea),
            estado: texto(item.taller).toUpperCase()
                ? 'RESERVADO'
                : 'DISPONIBLE',
            fechaOrden: texto(item.fechaTarea),
            movimientoId: texto(item.movimientoId),
            fechaSalida: texto(item.fechaSalida)
        }))
        .filter(item =>
            item.cantidad >= 10 &&
            !item.movimientoId &&
            !item.fechaSalida
        )
        .forEach(item => registros.push(item));

    // TODO UNIFICADO: ARTÍCULO -> FECHA -> COLOR -> UBICACIÓN.
    registros.sort((a,b) => {
        const cmpArt = compararArticuloInforme(a,b);
        if(cmpArt !== 0) return cmpArt;

        const fa = fechaOrdenInforme(a.fechaOrden);
        const fb = fechaOrdenInforme(b.fechaOrden);
        if(fa !== fb) return fa - fb;

        const fc = String(a.color || '').localeCompare(
            String(b.color || ''),
            'es',
            {sensitivity:'base'}
        );
        if(fc !== 0) return fc;

        return String(a.ubicacion || '').localeCompare(
            String(b.ubicacion || ''),
            'es',
            {sensitivity:'base'}
        );
    });

    const totalCantidad = registros.reduce(
        (total,item) => total + (Number(item.cantidad) || 0),
        0
    );

    const filas = registros.map(item => `
        <tr>
            <td class="art">${escaparInforme(item.articulo)}</td>
            <td class="num">${escaparInforme(item.cantidad)}</td>
            <td>${escaparInforme(item.color)}</td>
            <td class="ubicacion">${escaparInforme(item.ubicacion)}</td>
            <td>${escaparInforme(fechaInformeDDMMAAAA(item.fecha))}</td>
            <td>${escaparInforme(item.estado)}</td>
        </tr>
    `).join('');

    return `<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MERCADERÍA EN PRODUCCIÓN — ${escaparInforme(fechaHoy)}</title>
<style>

    html,body{
        margin:0;
        padding:0;

        font-family:Arial,Helvetica,sans-serif;
    }
    body{font-size:13px}
    .pagina{width:100%;min-height:281mm;position:relative}
    .cabecera{
        text-align:center;
        margin-bottom:9px;
        border-bottom:2px solid #111;
        padding-bottom:7px;
    }
    .titulo{
        font-size:24px;
        font-weight:900;
        letter-spacing:.5px;
    }
    .subtitulo{
        font-size:14px;
        font-weight:700;
        margin-top:3px;
    }
    .bloque{border:1px solid #111;width:100%}
    .bloque-titulo{
        background:#111;
        color:#fff;
        text-align:center;
        padding:7px 9px;
        font-size:14px;
        font-weight:900;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    th,td{
        border-bottom:1px solid #aaa;
        padding:6px 6px;
        text-align:center;
        vertical-align:middle;
        line-height:1.15;
    }
    th{
        background:#ddd;
        font-size:12px;
        font-weight:900;
        white-space:nowrap;
    }
    td{font-size:13px}
    .art{font-weight:900;font-size:15px}
    .num{font-weight:900;white-space:nowrap}
    .ubicacion{font-weight:900}
    .pie{
        display:flex;
        justify-content:space-between;
        margin-top:8px;
        padding-top:6px;
        border-top:2px solid #111;
        font-weight:900;

    }
    .nota{font-size:11px;font-weight:700}
    .vacio{padding:12px;font-weight:900;text-align:center}

        body{-webkit-print-color-adjust:exact;print-color-adjust:exact}

    </div>

    <section class="bloque">
        <div class="bloque-titulo">

async function imprimirInformeProduccion(){

    const boton = document.getElementById(
        'btn-imprimir-informe-produccion'
    );

    if(boton){
        boton.disabled = true;
        boton.textContent = '⏳ PREPARANDO...';
    }

    try{
        const datosActualesPendientes =
            datosActuales().pendientes || [];

        // TAREAS se consulta solo al pedir el informe.
        const tareas =
            await obtenerDatosTareasInforme();

        const informe =
            construirInformeProduccion(
                datosActualesPendientes,
                tareas
            );

        const ventana = window.open(
            '',
            '_blank',
            'width=1400,height=900,scrollbars=yes'
        );

        if(!ventana){
            throw new Error(
                'El navegador bloqueó la ventana de impresión. Permití las ventanas emergentes para esta página.'
            );
        }

        ventana.document.open();
        ventana.document.write(informe);
        ventana.document.close();

    }catch(error){
        console.error(
            '❌ ERROR INFORME PRODUCCIÓN:',
            error
        );

        alert(
            '❌ No se pudo generar el informe.\n\n' +
            error.message
        );
    }finally{
        if(boton){
            boton.disabled = false;
            boton.textContent = '🖨️ INFORME';
        }
    }
}

document
