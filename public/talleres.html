<!DOCTYPE html>
<html lang="es">
<head>
<script src="/auth.js?v=10"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Company - Talleres</title>


<style id="gc-talleres-index-estetica">
:root{
    --gc-bg:#0f172a;
    --gc-panel:#0f172a;
    --gc-panel-2:#1e293b;
    --gc-border:#334155;
    --gc-border-soft:#475569;
    --gc-text:#e2e8f0;
    --gc-muted:#94a3b8;
    --gc-white:#fff;
    --gc-green:#059669;
    --gc-green-hover:#047857;
    --gc-blue:#2563eb;
    --gc-blue-hover:#1d4ed8;
    --gc-red:#dc2626;
    --gc-red-hover:#b91c1c;
}

*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
}

body{
    background:var(--gc-bg) !important;
    color:var(--gc-text) !important;
    font-family:Arial,Helvetica,sans-serif;
}

.gc-talleres-wrap{
    width:94%;
    max-width:1600px;
    margin:0 auto;
    padding:16px 12px 28px;
}

.gc-topbar{
    background:rgba(15,23,42,.96);
    border:1px solid var(--gc-border);
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    padding:16px 18px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
}

.gc-brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.gc-brand-logo{
    width:150px;
    height:44px;
    object-fit:contain;
    object-position:left center;
}

.gc-brand-mark{
    display:none;
    width:42px;
    height:42px;
    border-radius:9px;
    background:var(--gc-green);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:15px;
    letter-spacing:.5px;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
}

.gc-brand-title{
    color:#fff;
    font-size:20px;
    font-weight:900;
    line-height:1;
    letter-spacing:.4px;
}

.gc-brand-sub{
    color:var(--gc-muted);
    font-size:13px;
    font-weight:700;
    margin-top:5px;
}

.gc-top-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.gc-back{
    border:0;
    background:#334155;
    color:#fff;
    border-radius:7px;
    padding:8px 12px;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.20);
    transition:all .15s;
}

.gc-back:hover{
    background:#475569;
    transform:translateY(-1px);
}

.gc-db-badge{
    background:#2563eb;
    color:#fff;
    border-radius:999px;
    padding:6px 10px;
    font-size:10px;
    font-weight:900;
}

.gc-talleres-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
    align-items:start;
}

.gc-card{
    background:rgba(15,23,42,.96);
    border:1px solid var(--gc-border);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    min-width:0;
}

.gc-card-head{
    padding:11px 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    color:#fff;
}

.gc-card-head.blue{background:#2563eb}
.gc-card-head.orange{background:#d97706}
.gc-card-head.violet{background:#7c3aed}

.gc-card-title{
    font-size:17px;
    font-weight:900;
    letter-spacing:.4px;
}

.gc-card-count{
    min-width:26px;
    text-align:center;
    font-size:15px;
    font-weight:900;
}

.gc-card-body{
    padding:13px;
}

.gc-add-row{
    display:flex;
    gap:7px;
    margin-bottom:12px;
}

.gc-input{
    flex:1;
    min-width:0;
    height:38px;
    border:1px solid var(--gc-border-soft) !important;
    border-radius:7px !important;
    background:#1e293b !important;
    color:#e2e8f0 !important;
    padding:8px 10px !important;
    font-size:14px !important;
    font-weight:800 !important;
    outline:none !important;
    text-transform:uppercase;
}

.gc-input::placeholder{
    color:#94a3b8;
    opacity:1;
}

.gc-input:focus{
    border-color:#64748b !important;
    box-shadow:0 0 0 2px rgba(100,116,139,.18) !important;
}

.gc-add-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:7px;
    color:#fff;
    font-size:20px;
    font-weight:900;
    line-height:1;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.20);
    transition:all .15s;
}

.gc-add-btn.blue{background:var(--gc-blue)}
.gc-add-btn.blue:hover{background:var(--gc-blue-hover);transform:translateY(-1px)}
.gc-add-btn.orange{background:#d97706}
.gc-add-btn.orange:hover{background:#b45309;transform:translateY(-1px)}
.gc-add-btn.green{background:var(--gc-green)}
.gc-add-btn.green:hover{background:var(--gc-green-hover);transform:translateY(-1px)}
.gc-add-btn.violet{background:#7c3aed}
.gc-add-btn.violet:hover{background:#6d28d9;transform:translateY(-1px)}

.gc-list{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.gc-list > div{
    background:#1e293b !important;
    border:1px solid var(--gc-border) !important;
    border-radius:7px !important;
    min-height:40px;
    padding:8px 10px !important;
    color:var(--gc-text);
    transition:background .15s,border-color .15s;
}

.gc-list > div:hover{
    background:#273449 !important;
    border-color:#475569 !important;
}

.gc-list span{
    color:#e2e8f0 !important;
    font-size:14px !important;
    font-weight:900 !important;
}

.gc-list button{
    color:#f87171 !important;
    font-size:14px !important;
    background:transparent !important;
    border:0 !important;
    cursor:pointer;
    padding:2px 5px !important;
}

.gc-list button:hover{
    color:#fca5a5 !important;
    background:rgba(220,38,38,.10) !important;
    border-radius:5px !important;
}

@media(max-width:1023px){
    .gc-talleres-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:640px){
    .gc-talleres-wrap{
        width:96%;
        padding:10px 5px 20px;
    }

    .gc-topbar{
        padding:12px;
        align-items:flex-start;
    }

    .gc-brand-logo{width:130px;height:38px}
    .gc-brand-title{font-size:17px}
    .gc-brand-sub{font-size:10px}

    .gc-top-actions{
        flex-direction:column;
        align-items:stretch;
    }

    .gc-back,.gc-db-badge{
        text-align:center;
    }
}

@media(min-width:1600px){
    body{zoom:1.02}
}
@media(min-width:1900px){
    body{zoom:1.04}
}

::-webkit-scrollbar{
    width:8px;
    height:8px;
}
::-webkit-scrollbar-track{
    background:#0f172a;
}
::-webkit-scrollbar-thumb{
    background:#475569;
    border-radius:10px;
}
::-webkit-scrollbar-thumb:hover{
    background:#64748b;
}
</style>

<style id="gc-talleres-header-final">
.gc-topbar{
    min-height:68px;
    padding:9px 16px;
}
.gc-brand{
    min-width:250px;
    display:flex;
    align-items:center;
}
.gc-brand-logo{
    height:62px !important;
    width:auto !important;
    object-fit:contain;
    display:block;
}
.gc-page-title{
    flex:1;
    text-align:center;
    color:#fff !important;
    font-size:29px !important;
    line-height:1 !important;
    font-weight:900 !important;
    letter-spacing:.8px;
    text-transform:uppercase;
}
.gc-top-actions{
    min-width:250px;
    justify-content:flex-end;
}
@media(max-width:640px){
    .gc-topbar{
        min-height:62px;
        padding:8px 10px;
    }
    .gc-brand{min-width:auto}
    .gc-brand-logo{height:50px !important}
    .gc-page-title{font-size:21px !important}
    .gc-top-actions{min-width:auto}
}
</style>

</head>

<div class="gc-talleres-grid">

<section class="gc-card">
    <div class="gc-card-head blue">
        <h2 class="gc-card-title">TALLERES</h2>
        <span id="contador-talleres" class="gc-card-count">0</span>
    </div>
    <div class="gc-card-body">
        <div class="gc-add-row">
            <input id="nuevo-taller" type="text" placeholder="Nombre del taller..." class="gc-input">
            <button id="btn-agregar-taller" class="gc-add-btn blue">+</button>
        </div>
        <div id="lista-talleres" class="gc-list"></div>
    </div>
</section>

<section class="gc-card">
    <div class="gc-card-head orange">
        <h2 class="gc-card-title">COLORES</h2>
        <span id="contador-colores" class="gc-card-count">0</span>
    </div>
    <div class="gc-card-body">
        <div class="gc-add-row">
            <input id="nuevo-color" type="text" placeholder="Nombre del color..." class="gc-input">
            <button id="btn-agregar-color" class="gc-add-btn orange">+</button>
        </div>
        <div id="lista-colores" class="gc-list"></div>
    </div>
</section>

<section class="gc-card">
    <div class="gc-card-head violet">
        <h2 class="gc-card-title">COLOR MATERIAL</h2>
        <span id="contador-colores-material" class="gc-card-count">0</span>
    </div>
    <div class="gc-card-body">
        <div class="gc-add-row">
            <input id="nuevo-color-material" type="text" placeholder="Ej.: ROJO, AZUL, SUELA..." class="gc-input">
            <button id="btn-agregar-color-material" class="gc-add-btn violet">+</button>
        </div>
        <div id="lista-colores-material" class="gc-list"></div>
    </div>
</section>

</div>
