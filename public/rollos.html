<!DOCTYPE html><html lang="es"><head><script src="/auth.js?v=10"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GOOD COMPANY — Control de rollos</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#1e3a8a 0%,#0f172a 35%,#020617 100%);color:#e2e8f0;min-height:100vh}.wrap{width:95%;max-width:1100px;margin:auto;padding:16px 0 36px}.panel{background:rgba(15,23,42,.94);border:1px solid #475569;border-radius:12px;box-shadow:0 15px 35px #0005}.header{display:flex;align-items:center;gap:12px;padding:14px 18px;margin-bottom:16px}.logo{width:135px;max-width:30%;height:auto}.header h1{flex:1;text-align:center;font-size:24px;margin:0;font-weight:900;letter-spacing:.5px}.demo{font-size:12px;color:#fbbf24;text-align:center;margin:-5px 0 13px}.toolbar{padding:13px;display:flex;gap:10px;margin-bottom:14px}input{background:#1e293b;color:white;border:1px solid #64748b;border-radius:8px;padding:12px;font-size:16px;min-width:0}input:focus{outline:2px solid #3b82f6}.search{flex:1}.toolbar{flex-wrap:wrap}.toolbar #printStock{white-space:nowrap}@media(max-width:650px){.toolbar #printStock{width:100%}}.btn{border:0;border-radius:8px;color:white;font-size:15px;font-weight:900;min-height:46px;padding:10px 15px;cursor:pointer}.blue{background:#2563eb}.green{background:#16a34a}.red{background:#dc2626}.muted{background:#334155}.btn:disabled{opacity:.4;cursor:not-allowed}.tablebox{overflow:auto;max-height:49vh}.stock{width:100%;border-collapse:collapse;text-align:center}.stock th{background:#1e293b;color:#cbd5e1;font-size:13px;padding:12px 6px;position:sticky;top:0}.stock td{padding:12px 6px;border-bottom:1px solid #334155;font-size:15px;font-weight:800}.stock tbody tr{cursor:pointer}.stock tbody tr:hover{background:#1e293b}.stock tbody tr.selected{background:#1d4ed855;outline:2px solid #3b82f6;outline-offset:-2px}.stock td:first-child{font-weight:900;color:white}.stock td:nth-child(3){font-size:18px;color:#93c5fd}.editor{margin-top:16px;padding:17px}.editor h2{margin:0 0 6px;font-size:18px}.selected-name{font-size:16px;color:#93c5fd;font-weight:800;min-height:24px}.editrow{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-top:12px}.qtygroup{display:flex;gap:7px;align-items:center}.qtygroup input{width:80px;text-align:center;font-weight:900}.step{width:45px;padding:0;font-size:24px}.actions{display:flex;gap:10px;flex:1}.actions .btn{flex:1}.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.notice{margin-top:12px;min-height:20px;font-size:14px;font-weight:800}.small{color:#94a3b8;font-size:12px;margin-top:10px}@media(max-width:650px){.wrap{width:96%;padding-top:8px}.header{padding:10px;gap:8px}.logo{width:86px;max-width:27%}.header h1{font-size:16px}.toolbar{padding:9px}.stock th{font-size:11px;padding:11px 3px}.stock td{font-size:12px;padding:12px 3px}.stock td:nth-child(3){font-size:15px}.editor{padding:13px}.editrow{display:block}.qtygroup{justify-content:center;margin-bottom:12px}.qtygroup input{flex:1;max-width:130px}.actions{display:grid;grid-template-columns:1fr 1fr}.bottom .btn{flex:1;font-size:12px}.tablebox{max-height:48vh}}
/* Evita el zoom por doble toque al pulsar +/- repetidamente en móviles. */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,.btn,.step{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.qtygroup input{font-size:16px;touch-action:manipulation}
.step{min-width:52px;min-height:52px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
@media(max-width:650px){.step{width:56px;min-width:56px;height:54px;min-height:54px;font-size:29px}.qtygroup{gap:12px}}
.back-header{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;text-decoration:none;background:#2563eb;border:1px solid #60a5fa;color:white;border-radius:9px;padding:10px 13px;font-weight:900;font-size:13px;min-height:43px;touch-action:manipulation}.back-header:hover{background:#1d4ed8}.back-mobile{display:none}@media(max-width:650px){.back-header{padding:8px 10px;min-height:39px;font-size:12px}.back-header .back-text{display:none}.back-header .back-mobile{display:inline}}

.gc-new-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px}
.gc-new-overlay.open{display:flex}.gc-new-panel{width:min(480px,100%);padding:22px;max-height:92dvh;overflow:auto}
.gc-new-panel h2{margin:0 0 18px;font-size:21px;color:#fff}.gc-new-titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.gc-new-close{border:1px solid #64748b;border-radius:8px;background:#334155;color:white;font-size:25px;font-weight:900;width:42px;height:42px;cursor:pointer;flex-shrink:0;touch-action:manipulation}.gc-new-close:disabled{opacity:.45;cursor:not-allowed}.gc-new-overlay{z-index:2147483647}.gc-new-overlay.open{isolation:isolate}.gc-new-fields{display:grid;gap:13px}.gc-new-fields label{font-size:13px;font-weight:800;color:#cbd5e1;display:grid;gap:6px}.gc-new-fields input{width:100%;font-size:16px}.gc-new-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:20px}
</style></head><body><main class="wrap"><header class="panel header"><img class="logo" src="https://raw.githubusercontent.com/serper-1981/LOGOS/main/LOGO%20TRANSPARENTE%20BLANCO.png" alt="GOOD COMPANY"><h1>CONTROL DE ROLLOS Y COLORES</h1><a class="back-header" href="/index.html" aria-label="Volver al inicio">← <span class="back-text">VOLVER AL INICIO</span><span class="back-mobile" aria-hidden="true">INICIO</span></a></header><p class="demo">STOCK DE FÁBRICA — Conectado a Google Sheets</p><section class="panel toolbar"><input class="search" id="search" placeholder="Buscar material o color…" aria-label="Buscar material o color"><button class="btn blue" id="refresh" title="Actualizar stock">↻</button><button class="btn muted" id="printStock" type="button">🖨️ IMPRIMIR</button></section><section class="panel tablebox"><table class="stock"><thead><tr><th>MATERIAL</th><th>COLOR</th><th>ROLLOS</th><th>METROS</th></tr></thead><tbody id="rows"></tbody></table></section><section class="panel editor"><h2>ACTUALIZAR STOCK</h2><div class="selected-name" id="selected">Seleccioná un material y color de la tabla</div><div class="editrow"><div class="qtygroup"><button class="btn muted step" id="less">−</button><input type="number" id="qty" min="1" step="1" value="1" aria-label="Cantidad de rollos"><button class="btn blue step" id="more">+</button></div><div class="actions"><button class="btn red" id="subtract">− DESCONTAR</button><button class="btn green" id="add">+ AGREGAR</button></div></div><div class="notice" id="notice" role="status"></div><div class="small">Cada operación actualiza rollos, metros y fecha en Google Sheets.</div></section><div class="bottom"><button class="btn green" id="new">+ AGREGAR TELA NUEVA</button><button class="btn muted" onclick="location.href='index.html'">VOLVER</button></div></main><div class="gc-new-overlay" id="newOverlay" role="dialog" aria-modal="true" aria-labelledby="newTitle"><div class="panel gc-new-panel"><div class="gc-new-titlebar"><h2 id="newTitle">+ AGREGAR TELA NUEVA</h2><button type="button" id="newClose" class="gc-new-close" aria-label="Cerrar formulario">×</button></div><form id="newForm"><div class="gc-new-fields"><label>MATERIAL<input id="newMaterial" maxlength="100" required autocomplete="off" placeholder="Ej.: A1314"></label><label>COLOR<input id="newColor" maxlength="100" required autocomplete="off" placeholder="Ej.: NEGRO 1"></label><label>METROS POR ROLLO<input id="newMeters" type="text" inputmode="decimal" required value="33,8"></label><label>CANTIDAD DE ROLLOS<input id="newCount" type="number" inputmode="numeric" min="1" step="1" required value="1"></label></div><div id="newError" class="notice" role="status"></div><div class="gc-new-actions"><button type="submit" class="btn green" id="newSave">GUARDAR COLOR Y CONTINUAR</button></div></form></div></div><script>
let data=[],selected=-1,busy=false;const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('es-AR',{maximumFractionDigits:2});
function aviso(t){$('notice').textContent=t}
// El selector de cantidad nunca supera los rollos disponibles del color elegido.
function limitarCantidad(){
 const x=data[selected],campo=$('qty');
 const max=x?Math.max(1,Math.floor(Number(x.rollos)||1)):null;
 campo.max=max===null?'':String(max);
 const n=Number(campo.value);
 if(campo.value!=='' && (!Number.isFinite(n)||n<1||!Number.isInteger(n)))campo.value='1';
 if(max!==null && Number(campo.value)>max)campo.value=String(max);
 $('more').disabled=!!x && Number(campo.value)>=max;
}

function render(){const q=$('search').value.trim().toLowerCase();$('rows').replaceChildren();data.forEach((x,i)=>{if(!(`${x.material} ${x.color}`.toLowerCase().includes(q)))return;const tr=document.createElement('tr');if(i===selected)tr.className='selected';[x.material,x.color,fmt(x.rollos),fmt(x.mtsRollo*x.rollos)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});tr.onclick=()=>{selected=i;$('selected').textContent=`${x.material} — ${x.color} · Stock: ${x.rollos} rollos`;aviso('');limitarCantidad();render()};$('rows').append(tr)})}
async function peticion(url,options){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Error del servidor');return d}
async function cargar(){try{const elegido=data[selected];const d=await peticion('/api/rollos');data=d.rollos.filter(x=>Number(x.rollos)>0);selected=elegido?data.findIndex(x=>x.material===elegido.material&&x.color===elegido.color):-1;$('selected').textContent=selected<0?'Seleccioná un material y color de la tabla':`${data[selected].material} — ${data[selected].color} · Stock: ${data[selected].rollos} rollos`;limitarCantidad();render();aviso('Stock actualizado')}catch(e){aviso('ERROR: '+e.message)}}
function bloquear(v){busy=v;['add','subtract','new','refresh'].forEach(id=>$(id).disabled=v)}
async function change(tipo){if(busy)return;if(selected<0){aviso('Primero seleccioná un material.');return}const cantidad=Number($('qty').value),x=data[selected];if(!Number.isSafeInteger(cantidad)||cantidad<1){aviso('Ingresá una cantidad entera mayor a cero.');return}if(tipo==='descontar'&&cantidad>x.rollos){aviso('No hay suficientes rollos disponibles.');return}bloquear(true);try{await peticion('/api/rollos/mover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fila:x.fila,material:x.material,color:x.color,cantidad,tipo})});await cargar();aviso('Guardado correctamente en Google Sheets')}catch(e){aviso('ERROR: '+e.message);await cargar()}finally{bloquear(false)}}
// Impresión como INDEX: ventana nueva, impresión automática y cierre tras imprimir.
function escaparImpresion(valor){return String(valor??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function imprimirStock(){
 const ventana=window.open('','_blank','width=794,height=1123');
 if(!ventana){alert('El navegador bloqueó la ventana de impresión. Permití las ventanas emergentes para GOOD COMPANY.');return}
 ventana.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Preparando informe de stock</title></head><body style="font-family:Arial;padding:30px">Preparando informe de stock actualizado…</body></html>');ventana.document.close();
 $('printStock').disabled=true;
 try{
  const respuesta=await peticion('/api/rollos');
  const lista=(respuesta.rollos||[]).filter(x=>Number(x.rollos)>0).sort((a,b)=>String(a.material).localeCompare(String(b.material),'es',{numeric:true,sensitivity:'base'})||String(a.color).localeCompare(String(b.color),'es',{numeric:true,sensitivity:'base'}));
  const fecha=new Date().toLocaleDateString('es-AR');
  const hora=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  let totalRollos=0,totalMetros=0,materialPrevio=null;
  const filas=lista.map(x=>{
   const material=String(x.material||''),color=String(x.color||'');
   const rollos=Number(x.rollos)||0,metrosRollo=Number(x.mtsRollo)||0,metros=rollos*metrosRollo;
   totalRollos+=rollos;totalMetros+=metros;
   const separador=materialPrevio!==null&&material!==materialPrevio?'<tr class="espacio"><td colspan="5"></td></tr>':'';
   materialPrevio=material;
   return separador+'<tr><td>'+escaparImpresion(material)+'</td><td>'+escaparImpresion(color)+'</td><td class="num">'+escaparImpresion(fmt(metrosRollo))+'</td><td class="num">'+escaparImpresion(fmt(rollos))+'</td><td class="num">'+escaparImpresion(fmt(metros))+'</td></tr>';
  }).join('');
  const logo='https://raw.githubusercontent.com/serper-1981/LOGOS/main/LOGO%20TRANSPARENTE%20BLANCO.png';
  const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>GOOD COMPANY — STOCK DE TELAS</title><style>
  @page{size:A4 portrait;margin:12mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0;font-size:10pt}
  .encabezado{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:12px;gap:16px}
  .logo{width:145px;max-height:65px;object-fit:contain;filter:brightness(0)}h1{font-size:17pt;margin:0;font-weight:900}p{margin:5px 0 0;color:#444;font-size:9pt}
  table{width:100%;border-collapse:collapse}thead{display:table-header-group}th{background:#c9c9c9;font-size:9pt;text-align:left;padding:8px 7px;border-bottom:1px solid #444}td{padding:6px 7px;border-bottom:1px solid #ddd;font-size:9pt}th.num,td.num{text-align:right;white-space:nowrap}
  .espacio td{height:11px;padding:0;border:0}tfoot td{border-top:2px solid #111;border-bottom:0;background:#e1e1e1;font-weight:900;font-size:10pt;padding:10px 7px}
  tr{break-inside:avoid}footer{font-size:8pt;color:#555;margin-top:14px;text-align:right}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style></head><body><header class="encabezado"><img class="logo" src="${logo}" alt="GOOD COMPANY"><div><h1>STOCK DE TELAS</h1><p>Fecha: ${escaparImpresion(fecha)} · Hora: ${escaparImpresion(hora)}</p></div></header>
  <table><thead><tr><th>MATERIAL</th><th>COLOR</th><th class="num">MTS / ROLLO</th><th class="num">ROLLOS</th><th class="num">METROS</th></tr></thead><tbody>${filas||'<tr><td colspan="5">No hay telas en stock.</td></tr>'}</tbody><tfoot><tr><td colspan="3">TOTAL GENERAL</td><td class="num">${escaparImpresion(fmt(totalRollos))}</td><td class="num">${escaparImpresion(fmt(totalMetros))}</td></tr></tfoot></table><footer>GOOD COMPANY · Informe de existencias actualizado</footer></body></html>`;
  ventana.document.open();ventana.document.write(html);ventana.document.close();ventana.focus();
  setTimeout(()=>{try{ventana.print()}catch(error){console.error('ERROR IMPRIMIENDO STOCK:',error);alert('No se pudo abrir la impresión: '+error.message)}},400);
  ventana.addEventListener('afterprint',()=>setTimeout(()=>{try{ventana.close()}catch(_){}},150));
 }catch(error){try{ventana.close()}catch(_){}alert('No se pudo obtener el stock para imprimir: '+error.message)}
 finally{$('printStock').disabled=false}
}
$('printStock').addEventListener('click',imprimirStock);
$('search').oninput=render;$('less').onclick=()=>{$('qty').value=Math.max(1,Number($('qty').value||1)-1);limitarCantidad()};$('more').onclick=()=>{$('qty').value=Math.max(1,Number($('qty').value||0)+1);limitarCantidad()};$('add').onclick=()=>change('sumar');$('subtract').onclick=()=>change('descontar');$('refresh').onclick=cargar;$('qty').addEventListener('input',limitarCantidad);$('qty').addEventListener('change',limitarCantidad);
limitarCantidad();
function cerrarNuevaTela(){if(busy)return;$('newOverlay').classList.remove('open');$('newError').textContent=''}
$('new').onclick=()=>{if(busy)return;$('newForm').reset();$('newError').textContent='';$('newOverlay').classList.add('open');$('newMaterial').focus()};
$('newClose').onclick=cerrarNuevaTela;
$('newForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;
 const material=$('newMaterial').value.trim(),color=$('newColor').value.trim();
 const mtsRollo=Number($('newMeters').value.trim().replace(',','.'));
 const cantidad=Number($('newCount').value);
 if(!material||!color||!Number.isFinite(mtsRollo)||mtsRollo<=0||!Number.isSafeInteger(cantidad)||cantidad<1){$('newError').textContent='Completá todos los datos. La cantidad debe ser mayor a cero.';return}
 bloquear(true);$('newSave').disabled=true;$('newClose').disabled=true;$('newError').textContent='Guardando…';
 try{await peticion('/api/rollos/nuevo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({material,color,mtsRollo,cantidad})});await cargar();$('newColor').value='';$('newCount').value='1';$('newError').textContent='✓ Color guardado en Google Sheets. Ingresá el siguiente color o cerrá con ×.';$('newColor').focus();aviso('Color agregado correctamente en Google Sheets')}
 catch(err){$('newError').textContent='ERROR: '+err.message}
 finally{bloquear(false);$('newSave').disabled=false;$('newClose').disabled=false}
});cargar();
</script></body></html>
